name: Worker stub

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: primsdrive-cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18.0"
      - name: Install exact direct dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck, contract tests, and Wrangler dry-run
        run: npm run verify
        env:
          WRANGLER_SEND_METRICS: "false"
